<!--
  KYMAA WEBSITE CHECK — report template
  ─────────────────────────────────────
  This file is a complete, self-contained template. To produce a report:
    1. Replace the JSON inside <script id="report-data"> (schema in README.md).
    2. Open / serve the file. The small script at the bottom renders everything.
  Nothing else needs editing. Print (Ctrl/Cmd+P → Save as PDF) gives a clean A4.

<style>
  :root {
    --bone: #F2F0EA; --paper: #F7F5F0; --bone-2: #E9E6DD; --bone-3: #DDD9CE;
    --ink: #0B1726; --ink-2: #4A5566; --navy: #00244E; --navy-2: #0A3261;
    --signal: #0678FF; --signal-text: #0060DF; --sky: #5AA8FF; --mist: #9DB0C8;
    --ember: #C2410C; --amber: #9A6700;
    --rule: rgba(11, 23, 38, .14);
    --f-disp: 'Archivo', 'Arial Narrow', system-ui, sans-serif;
    --f-serif: 'Instrument Serif', Georgia, serif;
    --f-body: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --f-mono: 'Geist Mono', ui-monospace, Menlo, monospace;
    --pad: clamp(22px, 5.5vw, 56px);
    --cut: 28px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bone-2); color: var(--ink); font: 400 16px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
  a { color: inherit; }

  .disp { font-family: var(--f-disp); font-stretch: 112%; font-weight: 500; letter-spacing: -0.04em; line-height: .95; }
  .serif { font-family: var(--f-serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
  .mono { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; line-height: 1.5; }
  .marker { display: inline-flex; align-items: center; gap: 10px; }
  .marker::before { content: ''; width: 9px; height: 9px; flex: none; background: var(--signal); clip-path: polygon(0 0, 100% 0, 0 100%); }
  .on-dark .marker::before { background: var(--sky); }

  .sheet { max-width: 880px; margin: clamp(0px, 4vw, 48px) auto; background: var(--paper); box-shadow: 0 1px 0 var(--rule), 0 30px 60px -30px rgba(11,23,38,.25); }

  /* ── cover ─────────────────────────────────────────── */
  .cover { position: relative; overflow: hidden; background: var(--navy); color: var(--bone); padding: var(--pad); padding-bottom: calc(var(--pad) * .8); }
  .cover::after { content: ''; position: absolute; top: -20%; right: -18%; width: 34%; height: 150%; background: var(--signal); transform: skewX(-45deg); transform-origin: top right; opacity: .95; }
  .cover > * { position: relative; z-index: 1; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .logo { height: 22px; width: auto; color: var(--bone); display: block; }
  .top .mono { color: var(--mist); }
  .for { margin-top: clamp(40px, 7vw, 64px); color: var(--mist); }
  .biz { margin-top: 14px; font-size: clamp(40px, 8vw, 72px); max-width: 13ch; overflow-wrap: anywhere; }
  .domain { display: inline-block; margin-top: 16px; color: var(--sky); text-decoration: none; border-bottom: 1px solid rgba(90,168,255,.45); padding-bottom: 2px; font-size: 13px; letter-spacing: .08em; }

  .verdict { margin-top: clamp(36px, 6vw, 56px); display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; padding-top: 28px; border-top: 1px solid rgba(242,240,234,.18); }
  .grade { width: 112px; height: 112px; display: grid; place-items: center; color: #fff; font-family: var(--f-disp); font-stretch: 112%; font-weight: 600; font-size: 64px; letter-spacing: -0.04em; clip-path: polygon(22px 0, 100% 0, 100% 100%, 0 100%, 0 22px); }
  .grade small { display: block; }
  .v-title { font-size: clamp(26px, 4vw, 36px); }
  .v-sum { margin-top: 10px; color: #C9D3E0; max-width: 46ch; }
  .score { margin-top: 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .bar { display: flex; gap: 4px; }
  .bar i { width: 26px; height: 6px; background: rgba(242,240,234,.22); }
  .bar i.ok { background: var(--sky); }
  .score .mono { color: var(--mist); }

  /* ── body ──────────────────────────────────────────── */
  .body { padding: var(--pad); }
  section + section { margin-top: clamp(48px, 8vw, 72px); }
  .label { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--rule); padding-top: 14px; }
  .label > span:last-child { color: var(--ink-2); }
  .h2 { margin: 22px 0 8px; font-size: clamp(30px, 5vw, 44px); }
  .lede { color: var(--ink-2); max-width: 56ch; }

  .issues { list-style: none; padding: 0; margin-top: 28px; border-top: 1px solid var(--ink); }
  .issue { display: grid; grid-template-columns: 56px 1fr auto; gap: 0 18px; padding: 22px 0 24px; border-bottom: 1px solid var(--rule); break-inside: avoid; }
  .n { font-family: var(--f-mono); font-size: 13px; color: var(--signal-text); padding-top: 3px; }
  .i-title { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.35; }
  .i-why { margin-top: 6px; color: var(--ink-2); max-width: 58ch; }
  .i-fix { margin-top: 12px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: baseline; }
  .i-fix .mono { color: var(--signal-text); white-space: nowrap; }
  .i-fix p { max-width: 58ch; }
  .impact { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; padding-top: 3px; }
  .impact::before { content: ''; width: 8px; height: 8px; background: currentColor; }
  .impact.high { color: var(--ember); }
  .impact.medium { color: var(--amber); }
  .impact.low { color: var(--ink-2); }
  .impact.low::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }

  .wins { list-style: none; padding: 0; margin-top: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; border-top: 1px solid var(--ink); }
  .win { display: grid; grid-template-columns: 22px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--rule); break-inside: avoid; }
  .tick { width: 22px; height: 22px; background: var(--navy); color: var(--bone); display: grid; place-items: center; margin-top: 1px; }
  .w-title { font-weight: 600; }
  .w-detail { color: var(--ink-2); font-size: 14.5px; }

  /* ── plan / CTA ────────────────────────────────────── */
  .plan { background: var(--navy); color: var(--bone); padding: clamp(28px, 5vw, 48px); clip-path: polygon(var(--cut) 0, 100% 0, 100% 100%, 0 100%, 0 var(--cut)); break-inside: avoid; }
  .plan .label { border-color: rgba(242,240,234,.2); }
  .plan .label > span:last-child { color: var(--mist); }
  .plan .h2 { color: var(--bone); }
  .recs { list-style: none; padding: 0; margin-top: 24px; counter-reset: r; }
  .recs li { counter-increment: r; display: grid; grid-template-columns: 44px 1fr; padding: 16px 0; border-top: 1px solid rgba(242,240,234,.16); }
  .recs li::before { content: counter(r, decimal-leading-zero); font-family: var(--f-mono); font-size: 12px; color: var(--sky); padding-top: 4px; }
  .r-title { font-weight: 600; font-size: 17px; }
  .r-detail { color: #C9D3E0; font-size: 14.5px; margin-top: 2px; }
  .sign { margin-top: 28px; padding-top: 24px; border-top: 1px solid rgba(242,240,234,.2); display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
  .who { display: flex; align-items: center; gap: 14px; }
  .who img { width: 52px; height: 52px; object-fit: cover; object-position: 50% 20%; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); background: var(--navy-2); }
  .who b { display: block; font-weight: 600; }
  .who span { color: var(--mist); font-size: 14px; }
  .ctas { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 22px 0 26px; font-weight: 500; font-size: 15px; text-decoration: none; background: var(--bone); color: var(--ink); clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 12px); }
  .btn:hover { background: #fff; }
  .btn-line { background: transparent; color: var(--bone); box-shadow: inset 0 0 0 1px rgba(242,240,234,.5); clip-path: none; }
  .btn-line:hover { background: rgba(242,240,234,.08); }
  .btn:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }

  .foot { padding: 20px var(--pad) 28px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--ink-2); border-top: 1px solid var(--rule); }
  .foot a { text-decoration: none; }

  [hidden] { display: none !important; }

  @media (max-width: 640px) {
    .sheet { margin: 0; }
    .cover::after { width: 26%; right: -34%; top: -30%; }
    .verdict { grid-template-columns: 1fr; gap: 20px; }
    .grade { width: 88px; height: 88px; font-size: 50px; }
    .issue { grid-template-columns: 36px 1fr; }
    .impact { grid-column: 2; grid-row: 1; margin-bottom: 8px; }
    .i-title { grid-column: 2; }
    .issue > div { grid-column: 2; }
    .wins { grid-template-columns: 1fr; }
    .i-fix { grid-template-columns: 1fr; gap: 2px; }
    .btn { flex: 1 1 100%; justify-content: space-between; }
  }

  @page { size: A4; margin: 0; }
  @media print {
    body { background: var(--paper); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sheet { margin: 0; max-width: none; box-shadow: none; }
    .btn { box-shadow: none; }
    .plan { clip-path: none; }
  }
</style>

<script>
/* Renderer: reads #report-data and fills the page. No dependencies. */
(function () {
  var d = JSON.parse(document.getElementById('report-data').textContent);
  var GRADES = {
    A: { color: '#0678FF', verdict: 'In great shape' },
    B: { color: '#0A3261', verdict: 'Solid, with gaps' },
    C: { color: '#9A6700', verdict: 'Room to improve' },
    D: { color: '#C2410C', verdict: 'Needs work' },
    F: { color: '#9F1D1D', verdict: 'Needs urgent work' }
  };
  var IMPACT = { high: 'High impact', medium: 'Medium impact', low: 'Low impact' };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var get = function (path) { return path.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, v); };
  var date = new Date((d.checkedAt || new Date().toISOString().slice(0, 10)) + 'T12:00:00');
  var nice = date.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  var g = GRADES[String(d.grade || 'C').toUpperCase()] || GRADES.C;
  var issues = d.issues || [], wins = d.wins || [];
  var total = d.checksTotal || (issues.length + wins.length);
  var name = (d.business && d.business.name) || 'your business';

  var v = Object.assign({}, d, {
    headerLabel: 'Website check · ' + nice,
    preparedForLabel: 'Prepared for',
    verdict: d.verdict || g.verdict,
    scoreText: wins.length + ' of ' + total + ' checks passed',
    fixCount: issues.length + (issues.length === 1 ? ' item' : ' items'),
    winCount: wins.length + ' passing',
    planTitle: d.planTitle || 'What I’d do for ' + name,
    footnote: 'Checked on ' + nice + '. Results can vary between visits.'
  });

  document.title = 'Website check: ' + name + ' — Kymaa';
  document.querySelectorAll('[data-f]').forEach(function (el) { var x = get(el.dataset.f); if (x != null) el.textContent = x; });
  document.querySelectorAll('[data-href]').forEach(function (el) {
    var opt = el.dataset.optional;
    if (opt && !get(opt)) { el.hidden = true; return; }
    var u = get(el.dataset.href); if (u) el.href = u; else el.removeAttribute('href');
  });

  var tile = document.querySelector('[data-grade]');
  tile.style.background = g.color;
  tile.setAttribute('aria-label', 'Grade ' + d.grade);

  document.querySelector('[data-bar]').innerHTML = Array.from({ length: total }, function (_, i) { return '<i class="' + (i < wins.length ? 'ok' : '') + '"></i>'; }).join('');

  document.querySelector('[data-issues]').innerHTML = issues.map(function (it, i) {
    var imp = (it.impact || 'medium').toLowerCase();
    return '<li class="issue"><span class="n">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<div><h3 class="i-title">' + esc(it.title) + '</h3>' +
      (it.why ? '<p class="i-why">' + esc(it.why) + '</p>' : '') +
      (it.fix ? '<div class="i-fix"><span class="mono">The fix</span><p>' + esc(it.fix) + '</p></div>' : '') +
      '</div><span class="mono impact ' + imp + '">' + (IMPACT[imp] || esc(imp)) + '</span></li>';
  }).join('');

  if (!wins.length) document.querySelector('[data-wins-section]').hidden = true;
  document.querySelector('[data-wins]').innerHTML = wins.map(function (w) {
    return '<li class="win"><span class="tick" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.3 4.8 9 10 3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>' +
      '<div><div class="w-title">' + esc(w.title) + '</div>' + (w.detail ? '<div class="w-detail">' + esc(w.detail) + '</div>' : '') + '</div></li>';
  }).join('');

  document.querySelector('[data-recs]').innerHTML = (d.recommendations || []).map(function (r) {
    if (typeof r === 'string') r = { title: r };
    return '<li><div><div class="r-title">' + esc(r.title) + '</div>' + (r.detail ? '<div class="r-detail">' + esc(r.detail) + '</div>' : '') + '</div></li>';
  }).join('');

  var p = d.preparer || {};
  if (p.photo) { var img = document.querySelector('[data-photo]'); img.src = p.photo; img.alt = p.name || ''; img.hidden = false; }
})();
</script>
</body>
